<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>0-9 Cesium 검증</title>
    <!-- integrity: CDN 파일이 바뀌면 로드 거부. cesium 버전을 올리면 해시도 다시 계산 -->
    <script
      src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"
      integrity="sha384-1lWK5deN/B+lLaUw4lk6xKp/L19ii/98SZLk6K8YthDskgvc+GbdixLzbCnSS2Wn"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css"
      integrity="sha384-ghEeMdcWWzRv/BPeUcX835vcKDGrxvROXisl/Btpv3GeekBUXTSPVcFJpI1Tcrgp"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #fff;
        padding: 8px 12px;
        font: 13px/1.5 monospace;
        white-space: pre;
        border-radius: 6px;
        max-width: 420px;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="info">건물을 클릭하면 속성이 여기 나와요</div>
    <script type="module">
      // ?bench=1: 고정 경로 측정 화면(bench/). 없으면 평소 확인 화면 그대로
      const params = new URLSearchParams(location.search);
      const BENCH = params.get("bench") === "1";

      // Cesium ion 토큰 없이 쓰기: 기본 배경지도(ion)는 끄고 OpenStreetMap 배경만 깔기
      // 측정 화면은 바탕 지도 없음(네트워크 잡음 제거, 내 렌더러처럼 건물만)
      const viewer = new Cesium.Viewer("map", {
        baseLayer: BENCH
          ? false
          : Cesium.ImageryLayer.fromProviderAsync(
              Promise.resolve(
                new Cesium.OpenStreetMapImageryProvider({
                  url: "https://tile.openstreetmap.org/",
                }),
              ),
            ),
        geocoder: false,
        baseLayerPicker: false,
        timeline: false,
        animation: false,
      });

      // 지역 이름은 data/tiles/ 아래 폴더 이름. 경로 문자만 허용. 측정은 서울, 평소 화면은 관악이 기본
      const region = (params.get("region") ?? (BENCH ? "seoul" : "gwanak")).replace(/[^a-z0-9_-]/gi, "");
      const tilesetUrl = `../data/tiles/${region}/tileset.json`;

      let tileset;
      if (BENCH) {
        const { createCesiumAdapter } = await import("../bench/adapters/cesium.js");
        const { mountBenchPanel } = await import("../bench/panel.js");
        const adapter = createCesiumAdapter(viewer, tilesetUrl);
        await mountBenchPanel({
          adapter,
          region,
          pathUrl: params.get("path") ?? "../bench/path.json",
        });
        window.bench = adapter; // 콘솔 확인용 (bench.tileset)
      } else {
        // 타일 개수·LOD를 보는 검사 패널 (오른쪽 위)
        viewer.extend(Cesium.viewerCesium3DTilesInspectorMixin);

        tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
        viewer.scene.primitives.add(tileset);
        await viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.5, 6000));

        // 측정 경로 지점은 이 화면(OSM 켜짐)에서 보고 고름
        const { getCesiumCamera } = await import("../bench/adapters/cesium.js");
        const { mountCopyButton } = await import("../bench/panel.js");
        mountCopyButton(() => getCesiumCamera(viewer));
      }

      // 클릭한 건물의 속성 표시 = featureId → 속성표 연결 확인
      const info = document.getElementById("info");
      viewer.screenSpaceEventHandler.setInputAction((e) => {
        const f = viewer.scene.pick(e.position);
        if (!(f instanceof Cesium.Cesium3DTileFeature)) {
          info.textContent = "건물이 아님";
          return;
        }
        const lines = f
          .getPropertyIds()
          .map((id) => `${id}: ${f.getProperty(id)}`);
        info.textContent = `featureId: ${f.featureId}\n` + lines.join("\n");
        console.log(
          Object.fromEntries(
            f.getPropertyIds().map((id) => [id, f.getProperty(id)]),
          ),
        );
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      window.viewer = viewer;
      window.tileset = tileset; // 콘솔에서 확인용
    </script>
  </body>
</html>
