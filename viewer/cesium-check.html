<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>0-9 Cesium 검증</title>
    <!-- integrity: CDN 파일이 바뀌면 로드 거부. cesium 버전을 올리면 해시도 다시 계산 -->
    <script
      src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"
      integrity="sha384-1lWK5deN/B+lLaUw4lk6xKp/L19ii/98SZLk6K8YthDskgvc+GbdixLzbCnSS2Wn"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css"
      integrity="sha384-ghEeMdcWWzRv/BPeUcX835vcKDGrxvROXisl/Btpv3GeekBUXTSPVcFJpI1Tcrgp"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      /* 평소 화면(2-5 레이아웃): 왼쪽 고정 LNB(연도 → 레이어 → 지표 → 구 목록) + 그 오른쪽 캔버스
         건물 상세만 캔버스 위 카드(클릭했을 때 오른쪽 위). 출처 표기(Cesium credits)는 캔버스 안 왼쪽 아래라 LNB에 안 가림
         측정 화면(?bench=1)은 body.lnb가 없음 → LNB 없이 캔버스 1680×928(bench/canvas.js) 그대로 */
      /* 어두운 바탕. 글자 대비는 반투명 카드 뒤가 흰 지도일 때(가장 불리) 기준
         배경 실효색 #2c3344 → 본문 #f1f5f9 11.6:1, 보조 #cbd5e1 8.5:1, 흐린 연도 #94a3b8 4.9:1,
         ✓ #4ade80 7.3:1, ✗ #f87171 4.6:1, 안내·포커스 #fbbf24 7.6:1 (WCAG AA 4.5:1 이상). LNB는 불투명이라 이보다 높음 */
      :root {
        --lnb-w: 340px;
        --lnb-bg: #0f172a;
        --card-bg: rgb(15 23 42 / 0.88);
        --card-text: #f1f5f9;
        --card-sub: #cbd5e1;
        --card-dim: #94a3b8;
        --card-line: rgb(255 255 255 / 0.15);
        --card-focus: #fbbf24;
      }
      #lnb,
      #info.detail {
        color: var(--card-text);
        color-scheme: dark; /* 체크박스·스크롤바를 어두운 바탕용으로 */
        accent-color: #f1f5f9;
      }
      #lnb :focus-visible {
        outline: 2px solid var(--card-focus);
        outline-offset: 2px;
      }
      #lnb {
        display: none;
      }
      body.lnb #map {
        position: absolute;
        inset: 0 0 0 var(--lnb-w);
        width: auto;
        height: auto;
      }
      body.lnb #lnb {
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--lnb-w);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        background: var(--lnb-bg);
        font: 13px/1.4 system-ui, sans-serif;
        border-right: 1px solid var(--card-line);
      }
      #lnb > section {
        padding: 12px 16px;
        border-bottom: 1px solid var(--card-line);
      }
      #lnb > section[hidden] {
        display: none;
      }
      #lnb h2 {
        margin: 0 0 6px;
        font-size: 13px;
        font-weight: 600;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      /* 측정 경로용 "현재 카메라 값 복사"(bench/panel.js에 부모로 넘김): 캔버스 왼쪽 아래, 출처 표기(바닥 약 30px) 위 */
      #devtools {
        position: absolute;
        left: calc(var(--lnb-w) + 10px);
        bottom: 30px;
      }
      #devtools:empty {
        display: none;
      }
      #devtools {
        background: #fff;
        padding: 6px 8px;
        border-radius: 6px;
        font: 12px/1.6 monospace;
      }
      /* 측정 화면: 왼쪽 위 흰 상자(날것 속성) */
      #info {
        position: absolute;
        top: 10px;
        left: 10px;
        background: #fff;
        padding: 8px 12px;
        font: 13px/1.5 monospace;
        white-space: pre;
        border-radius: 6px;
        max-width: 420px;
      }
      /* 2-3 건물 상세(평소 화면): 캔버스 오른쪽 위 카드. 측정 화면은 위 #info 그대로 */
      #info.detail {
        left: auto;
        right: 10px;
        top: 92px; /* Cesium 오른쪽 위 도구 버튼(5~41px)·접힌 3D Tiles Inspector(50~82px) 아래 */
        max-height: calc(100% - 140px);
        overflow: auto;
        background: var(--card-bg);
        box-shadow: 0 1px 6px rgb(0 0 0 / 0.35);
        width: 260px;
        font: 13px/1.5 system-ui, sans-serif;
        white-space: normal;
        border-radius: 8px;
      }
      #info .verdict {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 600;
        font-size: 15px;
      }
      #info .basis {
        color: var(--card-sub);
        font-size: 11px;
        margin: 2px 0 6px;
      }
      #info .checks {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #info .checks li {
        margin: 3px 0;
      }
      #info .mark {
        display: inline-block;
        width: 1.2em;
        font-weight: 700;
      }
      #info .ok .mark {
        color: #4ade80;
      }
      #info .no .mark {
        color: #f87171;
      }
      #info .off {
        color: var(--card-dim);
      }
      #info dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0 0;
        padding-top: 6px;
        border-top: 1px solid var(--card-line);
        color: var(--card-sub);
        font-size: 12px;
      }
      #info dd {
        margin: 0;
        word-break: break-all;
      }
      #info .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgb(255 255 255 / 0.5);
      }
      #info[hidden] {
        display: none;
      }
      /* 2-1·2-2 레이어 패널(연도 + 레이어). 행은 viewer/layer-style.js가 LAYERS 목록으로 만듦 */
      #layers fieldset {
        border: 0;
        margin: 0 0 10px;
        padding: 0;
      }
      #layers legend {
        font-weight: 600;
        margin-bottom: 4px;
      }
      #layers .years label {
        margin-right: 12px;
      }
      #layers .layer {
        display: grid;
        grid-template-columns: var(--box-w) 14px 1fr;
        column-gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      #layers {
        --box-w: 20px; /* 체크박스 칸 너비(Chrome 기본 13px + 좌우 여백 7px) */
      }
      #layers .layer input {
        margin: 3px 3px 3px 4px; /* 칸 너비와 맞추려고 Chrome 기본값을 명시 */
      }
      #layers .layer small {
        grid-column: 3;
        color: var(--card-sub);
        font-size: 11px;
      }
      #layers .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgb(255 255 255 / 0.5);
      }
      /* 범례도 레이어 줄과 같은 칸(체크박스 칸 · 견본 · 이름). 체크박스 칸은 비움 */
      #layers .legend {
        display: grid;
        grid-template-columns: var(--box-w) 14px 1fr;
        column-gap: 6px;
        align-items: center;
        color: var(--card-sub);
        border-top: 1px solid var(--card-line);
        padding-top: 8px;
      }
      /* 2-4 지표(깔때기): LNB 안 세로 3단계 */
      #funnel .steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #funnel .step {
        display: grid;
        grid-template-columns: 1fr auto;
        column-gap: 8px;
        padding: 4px 0;
      }
      #funnel .step + .step {
        border-top: 1px dashed var(--card-line);
      }
      #funnel .label {
        font-weight: 600;
      }
      #funnel .num {
        grid-row: span 2;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        text-align: right;
      }
      #funnel .num small {
        font-size: 12px;
        font-weight: 400;
        margin-left: 2px;
      }
      #funnel .pct,
      #funnel .note {
        grid-column: 1;
        color: var(--card-sub);
        font-size: 11px;
      }
      #funnel .source {
        color: var(--card-sub);
        font-size: 11px;
        margin-top: 6px;
      }
      /* 2-5 구 목록: 이 칸만 LNB 안에서 스크롤 */
      #districts {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: 0;
      }
      #districts .head {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: baseline;
        gap: 4px 8px;
      }
      #districts .sort {
        border: 0;
        margin: 0 0 6px;
        padding: 0;
        color: var(--card-sub);
        font-size: 12px;
      }
      #districts .sort label {
        margin-left: 8px;
      }
      #districts .scroll {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        margin: 0 -16px;
        padding: 0 16px 8px;
      }
      #districts .row {
        display: grid;
        grid-template-columns: 2em 5.2em 1fr 4.2em;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 6px;
        border: 0;
        border-radius: 4px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      #districts .row:hover {
        background: rgb(255 255 255 / 0.06);
      }
      #districts .row[aria-pressed="true"] {
        background: rgb(255 255 255 / 0.14);
        box-shadow: inset 3px 0 0 var(--card-focus);
        font-weight: 600;
      }
      #districts .row.all {
        margin-bottom: 4px;
        border-bottom: 1px solid var(--card-line);
        border-radius: 4px 4px 0 0;
      }
      #districts .rank {
        color: var(--card-sub);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #districts .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      #districts .bar {
        height: 8px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
      }
      /* 막대만 전환(약 300ms ease-out). width가 아니라 transform → 레이아웃 없이 합성만. 숫자는 즉시 바뀜 */
      #districts .fill {
        display: block;
        height: 100%;
        transform-origin: left;
        transition: transform 300ms ease-out;
      }
      @media (prefers-reduced-motion: reduce) {
        #districts .fill {
          transition: none;
        }
      }
      #layers .hint {
        color: #fbbf24;
        font-size: 11px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <aside id="lnb" aria-label="침수 이력 · 현장 확인 후보">
      <section id="layers" aria-label="연도와 레이어"></section>
      <section id="funnel" aria-label="지표" aria-live="polite" hidden></section>
      <section id="districts" aria-label="구별 현장 확인 후보" hidden></section>
    </aside>
    <div id="map"></div>
    <div id="info">건물을 클릭하면 속성이 여기 나와요</div>
    <div id="devtools"></div>
    <script type="module">
      // ?bench=1: 고정 경로 측정 화면(bench/). 없으면 평소 확인 화면 그대로
      const params = new URLSearchParams(location.search);
      const BENCH = params.get("bench") === "1";
      // 개발용 UI("3D Tiles Inspector" · "현재 카메라 값 복사")는 ?debug=1일 때만. 평소엔 복사 버튼이 Cesium 로고·출처 표기를 가림
      const DEBUG = params.get("debug") === "1";
      // 측정 화면은 캔버스를 1680×928로 고정(평소 화면은 창 크기 따라감). Viewer를 만들기 전에 크기를 정함
      if (BENCH) {
        const { fixCanvasContainer } = await import("../bench/canvas.js");
        fixCanvasContainer(document.getElementById("map"));
      } else document.body.classList.add("lnb"); // 평소 화면만 왼쪽 LNB(캔버스는 그 오른쪽부터)

      // Cesium ion 토큰 없이 쓰기: 기본 배경지도(ion)는 끄고 OpenStreetMap 배경만 깔기
      // 측정 화면은 바탕 지도 없음(네트워크 잡음 제거, 내 렌더러처럼 건물만)
      const viewer = new Cesium.Viewer("map", {
        baseLayer: BENCH
          ? false
          : Cesium.ImageryLayer.fromProviderAsync(
              Promise.resolve(
                new Cesium.OpenStreetMapImageryProvider({
                  url: "https://tile.openstreetmap.org/",
                }),
              ),
            ),
        geocoder: false,
        baseLayerPicker: false,
        timeline: false,
        animation: false,
      });

      // 지역 이름은 data/tiles/ 아래 폴더 이름. 경로 문자만 허용. ?region 없으면 서울 전체(측정 화면도 같음)
      const region = (params.get("region") ?? "seoul").replace(/[^a-z0-9_-]/gi, "");
      const tilesetUrl = `../data/tiles/${region}/tileset.json`;

      let tileset;
      if (BENCH) {
        const { createCesiumAdapter } = await import("../bench/adapters/cesium.js");
        const { mountBenchPanel } = await import("../bench/panel.js");
        // ?path=로 다른 경로 파일을 쓸 수 있지만 같은 서버의 .json만 (다른 사이트 주소를 fetch하지 않게)
        const pathUrl = new URL(params.get("path") ?? "../bench/path.json", location.href);
        if (pathUrl.origin !== location.origin || !pathUrl.pathname.endsWith(".json"))
          throw new Error(`?path=는 같은 서버의 .json만 가능: ${pathUrl}`);
        const adapter = createCesiumAdapter(viewer, tilesetUrl);
        // ?captureAt=3000: 재생 시작 후 3000ms 화면을 PNG로 저장 (양수 ms만)
        const captureAt = Number(params.get("captureAt"));
        // ?bg=white: 캡처 그림의 배경색(CSS 색). 검은 배경은 인쇄하면 건물과 구분이 안 됨
        // 캡처 회차(invalid, 평균에서 빠짐)에서만 적용 → 측정 회차의 장면 조건은 그대로
        const bg = params.get("bg");
        if (bg) {
          const color = captureAt > 0 ? Cesium.Color.fromCssColorString(bg) : undefined;
          if (color) viewer.scene.backgroundColor = color;
          else console.warn(`[bench] ?bg=${bg} 무시: ${captureAt > 0 ? "CSS 색이 아님" : "?captureAt과 같이 쓸 때만 적용"}`);
        }
        await mountBenchPanel({ adapter, region, pathUrl, captureAt: captureAt > 0 ? captureAt : null });
        window.bench = adapter; // 콘솔 확인용 (bench.tileset)
      } else {
        // 타일 개수·LOD를 보는 검사 패널 (오른쪽 위, ?debug=1만). 처음엔 접어 둠 → 건물 상세 카드가 그 아래에 뜸
        if (DEBUG) {
          viewer.extend(Cesium.viewerCesium3DTilesInspectorMixin);
          viewer.cesium3DTilesInspector.viewModel.inspectorVisible = false;
        }

        tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
        viewer.scene.primitives.add(tileset);

        // 2-1 레이어 색칠(침수 이력·현장 확인 후보). 측정 화면(?bench=1)에는 안 붙임 → 측정 조건 그대로
        const { buildStyle, mountLayerPanel, DEFAULT_STATE } = await import("./layer-style.js");
        const { renderDetail } = await import("./building-detail.js");
        tileset.style = buildStyle(DEFAULT_STATE);

        // 2-3 건물 상세: 클릭한 건물이 왜 후보인지(아닌지). 빈 곳 클릭 → 닫기
        const info = document.getElementById("info");
        info.className = "detail";
        info.hidden = true; // 클릭했을 때만 캔버스 오른쪽 위에 뜸
        let selected = null;

        // 클릭한 건물 외곽선: 직접 만든 후처리 단계(PostProcessStage + czm_selected)
        // 선택한 건물 픽셀은 그대로 두고(판정 색 유지), 바깥 OUTLINE_PX 안에 선택 건물이 있는 픽셀만 남색 → 이웃 건물과 맞닿은 면도 둘러짐
        // Cesium 기본 silhouette(edge detection)를 안 쓴 이유: length가 두께가 아님(1.146 실측: 0.5 → 1.5 이상이면 외곽선이 사라짐),
        // 배경과 맞닿은 가장자리에만 그려짐. czm_selected(인자)는 현재 위치 기준 오프셋으로 동작(공식 문서엔 설명 없음, 1.146 실측)
        // selected가 비면 외곽선 없음. 측정 화면(?bench=1)은 이 분기를 안 타서 후처리 자체가 없음
        const OUTLINE_PX = 2; // 300m 높이 관악 zoom을 1/3로 줄여도 보이는 값(1.5는 흐림). 셰이더 반복은 3px까지
        const outlineStage = viewer.scene.postProcessStages.add(
          new Cesium.PostProcessStage({
            name: "building_outline",
            fragmentShader: `
              uniform sampler2D colorTexture;
              in vec2 v_textureCoordinates;
              uniform vec4 color;
              uniform float width;
              void main() {
                vec4 base = texture(colorTexture, v_textureCoordinates);
                if (czm_selected(vec2(0.0))) { out_FragColor = base; return; }
                vec2 px = 1.0 / vec2(textureSize(colorTexture, 0));
                bool near = false;
                for (int i = -3; i <= 3; i++)
                  for (int j = -3; j <= 3; j++) {
                    if (float(i * i + j * j) > width * width) continue;
                    if (czm_selected(vec2(float(i), float(j)) * px)) near = true;
                  }
                out_FragColor = near ? color : base;
              }`,
            uniforms: { color: Cesium.Color.fromCssColorString("#1e1b4b"), width: OUTLINE_PX },
          }),
        );
        outlineStage.selected = [];
        const outline = (f) => (outlineStage.selected = f ? [f] : []);

        const showDetail = () => {
          if (!selected) return;
          if (!renderDetail(info, selected, DEFAULT_STATE.years)) closeDetail(); // 타일이 내려가 못 읽음
        };
        const closeDetail = () => {
          selected = null;
          info.hidden = true;
          outline(null);
        };
        viewer.screenSpaceEventHandler.setInputAction((e) => {
          const f = viewer.scene.pick(e.position);
          if (f instanceof Cesium.Cesium3DTileFeature) {
            selected = f;
            outline(f);
            showDetail();
          } else closeDetail();
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // 2-4 지표 + 2-5 구 목록: 숫자는 전부 타일러 s09의 funnel.json(지역 전체·구별). 화면에서 세지 않음
        const { loadFunnel, renderFunnel, yearKey } = await import("./funnel.js");
        const { mountDistrictList } = await import("./district-list.js");
        const funnelData = await loadFunnel(`../data/tiles/${region}/funnel.json`);
        const funnelEl = document.getElementById("funnel");
        const districtsEl = document.getElementById("districts");

        // 고른 구(null = 지역 전체). 구 줄을 눌렀을 때만 바뀜 → 그 뒤 카메라를 움직여도 지표·선택은 그대로
        let district = null;
        const FLY_SECONDS = 1.5;
        const HOME_HEADING = 0, HOME_PITCH = -0.5; // 처음 화면 방향·기울기(전과 같음)
        // 지평선 쪽으로 눕힐수록 먼 모서리가 화면 위로 안 들어와서 맞춤 거리가 끝없이 커짐 → 최소 -20°로 제한
        const MAX_PITCH = Cesium.Math.toRadians(-20);
        const NEAR_VERTICAL = Cesium.Math.toRadians(-89);
        const FIT_PITCH_LIMIT = Cesium.Math.toRadians(-89.9);
        const MIN_SIDE = 1000; // m. 후보 bbox가 이보다 작으면(후보 1건 등) 중심 그대로 1km × 1km로 넓혀서 맞춤
        // 서울 전체 bbox = 25개 구 bbox를 합친 것(funnel.json, 타일러 s09). 지표가 없는 지역이면 null → 타일셋 전체로 대체
        const seoulBbox = funnelData && funnelData.districts.reduce(
          ([w, s, e, n], { bbox: b }) => [Math.min(w, b[0]), Math.min(s, b[1]), Math.max(e, b[2]), Math.max(n, b[3])],
          [Infinity, Infinity, -Infinity, -Infinity]);

        // bbox 네 꼭짓점이 화면 안(가장자리 5% 여백)에 들어오는 가장 가까운 거리. 임시 카메라로 이분 탐색
        // Cesium 기본(flyToBoundingSphere 거리 0)은 bbox를 감싼 구 전체를 넣어서 관악 기준 높이 약 7.3km
        // → 화면 오차 LOD로 큰 건물만 그려져 후보가 거의 안 보였음
        // 기울여 보면 가까운 쪽(남쪽) 모서리가 넓게 퍼져서 "가로 길이 ÷ 시야각" 공식으로는 화면을 벗어남(실측) → 꼭짓점을 직접 투영
        const fitRange = (center, corners, heading, pitch) => {
          const cam = new Cesium.Camera(viewer.scene);
          cam.frustum = viewer.camera.frustum.clone();
          const { fov, aspectRatio } = cam.frustum;
          const tx = Math.tan(fov / 2) * (aspectRatio >= 1 ? 1 : aspectRatio) * 0.95; // fov는 긴 변 기준(Cesium 문서)
          const ty = Math.tan(cam.frustum.fovy / 2) * 0.95;
          const v = new Cesium.Cartesian3();
          // 정확히 -90°면 lookAt이 heading을 잃어서(위에서 곧장 내려다보면 방향이 안 정해짐) 화면 회전이 실제 비행과 달라짐 → 맞춤 계산만 -89.9°로
          const fitPitch = Math.max(pitch, FIT_PITCH_LIMIT);
          const fits = (range) => {
            cam.lookAt(center, new Cesium.HeadingPitchRange(heading, fitPitch, range));
            return corners.every((p) => {
              Cesium.Cartesian3.subtract(p, cam.positionWC, v);
              const z = Cesium.Cartesian3.dot(v, cam.directionWC);
              return z > 0 && Math.abs(Cesium.Cartesian3.dot(v, cam.rightWC)) <= tx * z && Math.abs(Cesium.Cartesian3.dot(v, cam.upWC)) <= ty * z;
            });
          };
          let lo = 100, hi = 100_000; // m
          for (let i = 0; i < 30; i++) {
            const mid = (lo + hi) / 2;
            fits(mid) ? (hi = mid) : (lo = mid);
          }
          fits(hi); // 임시 카메라를 맞춘 자리에 둠 → 거기서 본 방향·기울기를 fitBbox가 읽음
          return { range: hi, cam };
        };
        // 구 전체 bbox 대신 "현재 연도 선택의 후보 건물만" bbox(s09 candidateBbox). 후보가 0건이면 구 전체로 대체
        const bboxFor = (d) => d.candidateBbox[yearKey(DEFAULT_STATE.years)] ?? d.bbox;
        // bbox [W,S,E,N](도) → 맞춤 카메라(중심 + 방향·기울기·거리). 한 변이 MIN_SIDE보다 짧으면 중심 기준으로 넓힘
        const fitBbox = ([w, s, e, n], heading, pitch) => {
          const lon = (w + e) / 2, lat = (s + n) / 2;
          const center = Cesium.Cartesian3.fromDegrees(lon, lat);
          // 이 위도에서 경도·위도 1°가 몇 m인지(타원체 위 실제 거리). 0.01° 떨어진 두 점으로 잼
          const mPerDeg = (dLon, dLat) => Cesium.Cartesian3.distance(center, Cesium.Cartesian3.fromDegrees(lon + dLon, lat + dLat)) / 0.01;
          const halfLon = Math.max((e - w) / 2, MIN_SIDE / 2 / mPerDeg(0.01, 0));
          const halfLat = Math.max((n - s) / 2, MIN_SIDE / 2 / mPerDeg(0, 0.01));
          const corners = [[-1, -1], [1, -1], [-1, 1], [1, 1]].map(([x, y]) => Cesium.Cartesian3.fromDegrees(lon + x * halfLon, lat + y * halfLat));
          // lookAt의 방향·기울기는 bbox 중심의 지평면 기준, camera.heading·pitch는 카메라 자리의 지평면 기준
          // 둘은 지구 곡률만큼 다름(관악 거리 약 7km에서 0.06°) → 그대로 쓰면 구를 누를 때마다 기울기가 조금씩 가팔라짐(실측 4번에 -29.10° → -29.30°)
          // 맞춘 자리에서 잰 차이만큼 한 번 되돌려서 다시 맞춤
          // 수직에 가까우면 안 고침: 카메라가 중심 바로 위라 차이가 없고, 수직에선 heading 값이 불안정해서
          // 고치면 오히려 돌아감(실측: heading 45°·pitch -90°에서 "서울 전체" → 90°)
          const first = fitRange(center, corners, heading, pitch);
          if (pitch < NEAR_VERTICAL) return { center, offset: new Cesium.HeadingPitchRange(heading, pitch, first.range) };
          const h = heading + Cesium.Math.negativePiToPi(heading - first.cam.heading);
          const p = Math.max(-Cesium.Math.PI_OVER_TWO, pitch + (pitch - first.cam.pitch));
          return { center, offset: new Cesium.HeadingPitchRange(h, p, fitRange(center, corners, h, p).range) };
        };
        // 지금 카메라의 방향·기울기를 그대로 씀(거리만 맞춤). 지평선 쪽(-20°보다 얕음)이면 -20°로
        const currentAngles = () => [viewer.camera.heading, Math.min(viewer.camera.pitch, MAX_PITCH)];
        // angles를 주면 그 방향·기울기로(Home), 안 주면 지금 카메라 그대로(구 클릭)
        const flyToBbox = (bbox, angles = currentAngles()) => {
          const [heading, pitch] = angles;
          const { center, offset } = fitBbox(bbox, heading, pitch);
          // 떠오르지 않고 옆으로 이동: 최고 높이 = max(출발, 도착). maximumHeight를 안 주면 Cesium이 거리에 비례해 자동으로 띄움
          // Cesium은 maximumHeight가 출발·도착 중 높은 쪽보다 클 때만 위로 휘고, 같으면 두 높이를 직선으로 이음(CameraFlightPath)
          const end = Cesium.Cartographic.fromCartesian(center).height - offset.range * Math.sin(offset.pitch);
          const maximumHeight = Math.max(viewer.camera.positionCartographic.height, end);
          viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(center, 1), { offset, duration: FLY_SECONDS, maximumHeight });
        };
        const flyTo = (d, angles) => flyToBbox(d ? bboxFor(d) : seoulBbox, angles);

        // Home 버튼(오른쪽 위 집): Cesium 기본은 지구 전체로 감 → 막고, 지금 고른 범위(구 또는 서울 전체)에 다시 맞춤
        // 방향·기울기만 처음 화면 값(0°, -0.5 rad = -28.65°)으로 되돌림. 맞춤·옆 이동은 구 클릭과 같은 flyToBbox
        // 지표가 없는 지역(seoulBbox 없음)은 Cesium 기본 동작 그대로
        if (seoulBbox)
          viewer.homeButton.viewModel.command.beforeExecute.addEventListener((e) => {
            e.cancel = true;
            flyTo(district, [HOME_HEADING, HOME_PITCH]);
          });
        const list = funnelData &&
          mountDistrictList(districtsEl, funnelData, (d) => {
            district = d;
            flyTo(d);
            refresh();
          });
        const refresh = () => {
          if (!funnelData) return;
          renderFunnel(funnelEl, funnelData, district, DEFAULT_STATE.years);
          list.update(DEFAULT_STATE.years, district);
          districtsEl.hidden = false;
        };
        refresh();

        // 연도·레이어를 바꾸면 색·열린 상세·지표·구 목록을 같은 기준으로 다시
        mountLayerPanel(document.getElementById("layers"), DEFAULT_STATE, (s) => {
          tileset.style = buildStyle(s);
          showDetail();
          refresh();
        });

        // 2-6 토글 반응 시간 측정: ?measure=1일 때만 불러서 자동으로 한 번 돌림. 콘솔에서 await runToggleMeasure()로 다시
        if (params.get("measure") === "1") {
          const { mountToggleMeasure } = await import("./toggle-measure.js");
          window.runToggleMeasure = mountToggleMeasure({ viewer, tileset, layersEl: document.getElementById("layers") });
          setTimeout(() => window.runToggleMeasure());
        }

        // 처음 카메라 = "서울 전체" 줄과 같은 맞춤(서울 bbox, 방향 0·기울기 -0.5). 지표가 없는 지역은 전처럼 타일셋 전체
        if (seoulBbox) {
          const { center, offset } = fitBbox(seoulBbox, HOME_HEADING, HOME_PITCH);
          viewer.camera.flyToBoundingSphere(new Cesium.BoundingSphere(center, 1), { offset, duration: 0 });
        } else await viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(HOME_HEADING, HOME_PITCH, 6000));

        // 측정 경로 지점은 이 화면(OSM 켜짐)에서 보고 고름. ?debug=1만: 평소엔 이 버튼이 Cesium 로고·출처 표기를 가림
        if (DEBUG) {
          const { getCesiumCamera } = await import("../bench/adapters/cesium.js");
          const { mountCopyButton } = await import("../bench/panel.js");
          mountCopyButton(() => getCesiumCamera(viewer), document.getElementById("devtools"));
        }
      }

      // 측정 화면: 클릭한 건물의 속성을 날것으로 표시(featureId → 속성표 연결 확인용, 0-9 그대로)
      if (BENCH) {
        const info = document.getElementById("info");
        viewer.screenSpaceEventHandler.setInputAction((e) => {
          const f = viewer.scene.pick(e.position);
          if (!(f instanceof Cesium.Cesium3DTileFeature)) {
            info.textContent = "건물이 아님";
            return;
          }
          const lines = f
            .getPropertyIds()
            .map((id) => `${id}: ${f.getProperty(id)}`);
          info.textContent = `featureId: ${f.featureId}\n` + lines.join("\n");
          console.log(
            Object.fromEntries(
              f.getPropertyIds().map((id) => [id, f.getProperty(id)]),
            ),
          );
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
      }

      window.viewer = viewer;
      window.tileset = tileset; // 콘솔에서 확인용
    </script>
  </body>
</html>
