<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>0-9 Cesium 검증</title>
    <!-- integrity: CDN 파일이 바뀌면 로드 거부. cesium 버전을 올리면 해시도 다시 계산 -->
    <script
      src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"
      integrity="sha384-1lWK5deN/B+lLaUw4lk6xKp/L19ii/98SZLk6K8YthDskgvc+GbdixLzbCnSS2Wn"
      crossorigin="anonymous"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css"
      integrity="sha384-ghEeMdcWWzRv/BPeUcX835vcKDGrxvROXisl/Btpv3GeekBUXTSPVcFJpI1Tcrgp"
      crossorigin="anonymous"
      rel="stylesheet"
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      /* 왼쪽 위 한 열: 레이어 패널(평소 화면만) → 클릭한 건물 속성. 아래 출처 표기(Cesium credits)는 안 가림 */
      /* 평소 화면 카드(레이어 패널·건물 상세): 어두운 반투명. 글자 대비는 카드 뒤가 흰 지도일 때(가장 불리) 기준
         배경 실효색 #2c3344 → 본문 #f1f5f9 11.6:1, 보조 #cbd5e1 8.5:1, 흐린 연도 #94a3b8 4.9:1,
         ✓ #4ade80 7.3:1, ✗ #f87171 4.6:1, 안내·포커스 #fbbf24 7.6:1 (WCAG AA 4.5:1 이상) */
      :root {
        --card-bg: rgb(15 23 42 / 0.88);
        --card-text: #f1f5f9;
        --card-sub: #cbd5e1;
        --card-dim: #94a3b8;
        --card-line: rgb(255 255 255 / 0.15);
        --card-focus: #fbbf24;
      }
      #layers,
      #info.detail {
        background: var(--card-bg);
        color: var(--card-text);
        color-scheme: dark; /* 체크박스를 어두운 바탕용으로 */
        accent-color: #f1f5f9;
        box-shadow: 0 1px 6px rgb(0 0 0 / 0.35);
      }
      #layers :focus-visible {
        outline: 2px solid var(--card-focus);
        outline-offset: 2px;
      }
      #side {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: calc(100% - 60px);
        overflow: auto;
      }
      #info {
        background: #fff;
        padding: 8px 12px;
        font: 13px/1.5 monospace;
        white-space: pre;
        border-radius: 6px;
        max-width: 420px;
      }
      /* 2-3 건물 상세(평소 화면). 측정 화면은 위 #info 그대로(날것 속성) */
      #info.detail {
        width: 260px;
        font: 13px/1.5 system-ui, sans-serif;
        white-space: normal;
        border-radius: 8px;
      }
      #info .verdict {
        display: flex;
        gap: 6px;
        align-items: center;
        font-weight: 600;
        font-size: 15px;
      }
      #info .basis {
        color: var(--card-sub);
        font-size: 11px;
        margin: 2px 0 6px;
      }
      #info .checks {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #info .checks li {
        margin: 3px 0;
      }
      #info .mark {
        display: inline-block;
        width: 1.2em;
        font-weight: 700;
      }
      #info .ok .mark {
        color: #4ade80;
      }
      #info .no .mark {
        color: #f87171;
      }
      #info .off {
        color: var(--card-dim);
      }
      #info dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 2px 10px;
        margin: 8px 0 0;
        padding-top: 6px;
        border-top: 1px solid var(--card-line);
        color: var(--card-sub);
        font-size: 12px;
      }
      #info dd {
        margin: 0;
        word-break: break-all;
      }
      #info .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgb(255 255 255 / 0.5);
      }
      #info[hidden] {
        display: none;
      }
      /* 2-1·2-2 레이어 패널. 행은 viewer/layer-style.js가 LAYERS 목록으로 만듦 */
      #layers:empty {
        display: none;
      }
      #layers {
        width: 260px;
        padding: 10px 12px;
        font: 13px/1.4 system-ui, sans-serif;
        border-radius: 8px;
      }
      #layers fieldset {
        border: 0;
        margin: 0 0 10px;
        padding: 0;
      }
      #layers legend {
        font-weight: 600;
        margin-bottom: 4px;
      }
      #layers .years label {
        margin-right: 12px;
      }
      #layers .layer {
        display: grid;
        grid-template-columns: auto 14px 1fr;
        column-gap: 6px;
        align-items: center;
        margin: 4px 0;
      }
      #layers .layer small {
        grid-column: 3;
        color: var(--card-sub);
        font-size: 11px;
      }
      #layers .swatch {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgb(255 255 255 / 0.5);
      }
      #layers .legend {
        display: flex;
        gap: 6px;
        align-items: center;
        color: var(--card-sub);
        border-top: 1px solid var(--card-line);
        padding-top: 8px;
      }
      #layers .hint {
        color: #fbbf24;
        font-size: 11px;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="side">
      <section id="layers" aria-label="레이어"></section>
      <div id="info">건물을 클릭하면 속성이 여기 나와요</div>
    </div>
    <script type="module">
      // ?bench=1: 고정 경로 측정 화면(bench/). 없으면 평소 확인 화면 그대로
      const params = new URLSearchParams(location.search);
      const BENCH = params.get("bench") === "1";
      // 측정 화면은 캔버스를 1680×928로 고정(평소 화면은 창 크기 따라감). Viewer를 만들기 전에 크기를 정함
      if (BENCH) {
        const { fixCanvasContainer } = await import("../bench/canvas.js");
        fixCanvasContainer(document.getElementById("map"));
      }

      // Cesium ion 토큰 없이 쓰기: 기본 배경지도(ion)는 끄고 OpenStreetMap 배경만 깔기
      // 측정 화면은 바탕 지도 없음(네트워크 잡음 제거, 내 렌더러처럼 건물만)
      const viewer = new Cesium.Viewer("map", {
        baseLayer: BENCH
          ? false
          : Cesium.ImageryLayer.fromProviderAsync(
              Promise.resolve(
                new Cesium.OpenStreetMapImageryProvider({
                  url: "https://tile.openstreetmap.org/",
                }),
              ),
            ),
        geocoder: false,
        baseLayerPicker: false,
        timeline: false,
        animation: false,
      });

      // 지역 이름은 data/tiles/ 아래 폴더 이름. 경로 문자만 허용. 측정은 서울, 평소 화면은 관악이 기본
      const region = (params.get("region") ?? (BENCH ? "seoul" : "gwanak")).replace(/[^a-z0-9_-]/gi, "");
      const tilesetUrl = `../data/tiles/${region}/tileset.json`;

      let tileset;
      if (BENCH) {
        const { createCesiumAdapter } = await import("../bench/adapters/cesium.js");
        const { mountBenchPanel } = await import("../bench/panel.js");
        // ?path=로 다른 경로 파일을 쓸 수 있지만 같은 서버의 .json만 (다른 사이트 주소를 fetch하지 않게)
        const pathUrl = new URL(params.get("path") ?? "../bench/path.json", location.href);
        if (pathUrl.origin !== location.origin || !pathUrl.pathname.endsWith(".json"))
          throw new Error(`?path=는 같은 서버의 .json만 가능: ${pathUrl}`);
        const adapter = createCesiumAdapter(viewer, tilesetUrl);
        // ?captureAt=3000: 재생 시작 후 3000ms 화면을 PNG로 저장 (양수 ms만)
        const captureAt = Number(params.get("captureAt"));
        // ?bg=white: 캡처 그림의 배경색(CSS 색). 검은 배경은 인쇄하면 건물과 구분이 안 됨
        // 캡처 회차(invalid, 평균에서 빠짐)에서만 적용 → 측정 회차의 장면 조건은 그대로
        const bg = params.get("bg");
        if (bg) {
          const color = captureAt > 0 ? Cesium.Color.fromCssColorString(bg) : undefined;
          if (color) viewer.scene.backgroundColor = color;
          else console.warn(`[bench] ?bg=${bg} 무시: ${captureAt > 0 ? "CSS 색이 아님" : "?captureAt과 같이 쓸 때만 적용"}`);
        }
        await mountBenchPanel({ adapter, region, pathUrl, captureAt: captureAt > 0 ? captureAt : null });
        window.bench = adapter; // 콘솔 확인용 (bench.tileset)
      } else {
        // 타일 개수·LOD를 보는 검사 패널 (오른쪽 위)
        viewer.extend(Cesium.viewerCesium3DTilesInspectorMixin);

        tileset = await Cesium.Cesium3DTileset.fromUrl(tilesetUrl);
        viewer.scene.primitives.add(tileset);

        // 2-1 레이어 색칠(침수 이력·현장 확인 후보). 측정 화면(?bench=1)에는 안 붙임 → 측정 조건 그대로
        const { buildStyle, mountLayerPanel, DEFAULT_STATE } = await import("./layer-style.js");
        const { renderDetail } = await import("./building-detail.js");
        tileset.style = buildStyle(DEFAULT_STATE);

        // 2-3 건물 상세: 클릭한 건물이 왜 후보인지(아닌지). 빈 곳 클릭 → 닫기
        const info = document.getElementById("info");
        let selected = null;

        // 클릭한 건물 외곽선: 직접 만든 후처리 단계(PostProcessStage + czm_selected)
        // 선택한 건물 픽셀은 그대로 두고(판정 색 유지), 바깥 OUTLINE_PX 안에 선택 건물이 있는 픽셀만 남색 → 이웃 건물과 맞닿은 면도 둘러짐
        // Cesium 기본 silhouette(edge detection)를 안 쓴 이유: length가 두께가 아님(1.146 실측: 0.5 → 1.5 이상이면 외곽선이 사라짐),
        // 배경과 맞닿은 가장자리에만 그려짐. czm_selected(인자)는 현재 위치 기준 오프셋으로 동작(공식 문서엔 설명 없음, 1.146 실측)
        // selected가 비면 외곽선 없음. 측정 화면(?bench=1)은 이 분기를 안 타서 후처리 자체가 없음
        const OUTLINE_PX = 2; // 300m 높이 관악 zoom을 1/3로 줄여도 보이는 값(1.5는 흐림). 셰이더 반복은 3px까지
        const outlineStage = viewer.scene.postProcessStages.add(
          new Cesium.PostProcessStage({
            name: "building_outline",
            fragmentShader: `
              uniform sampler2D colorTexture;
              in vec2 v_textureCoordinates;
              uniform vec4 color;
              uniform float width;
              void main() {
                vec4 base = texture(colorTexture, v_textureCoordinates);
                if (czm_selected(vec2(0.0))) { out_FragColor = base; return; }
                vec2 px = 1.0 / vec2(textureSize(colorTexture, 0));
                bool near = false;
                for (int i = -3; i <= 3; i++)
                  for (int j = -3; j <= 3; j++) {
                    if (float(i * i + j * j) > width * width) continue;
                    if (czm_selected(vec2(float(i), float(j)) * px)) near = true;
                  }
                out_FragColor = near ? color : base;
              }`,
            uniforms: { color: Cesium.Color.fromCssColorString("#1e1b4b"), width: OUTLINE_PX },
          }),
        );
        outlineStage.selected = [];
        const outline = (f) => (outlineStage.selected = f ? [f] : []);

        const showDetail = () => {
          if (!selected) return;
          if (!renderDetail(info, selected, DEFAULT_STATE.years)) closeDetail(); // 타일이 내려가 못 읽음
        };
        const closeDetail = () => {
          selected = null;
          info.hidden = true;
          outline(null);
        };
        viewer.screenSpaceEventHandler.setInputAction((e) => {
          const f = viewer.scene.pick(e.position);
          if (f instanceof Cesium.Cesium3DTileFeature) {
            selected = f;
            outline(f);
            showDetail();
          } else closeDetail();
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

        // 연도·레이어를 바꾸면 색과 열린 상세를 같은 기준으로 다시
        mountLayerPanel(document.getElementById("layers"), DEFAULT_STATE, (s) => {
          tileset.style = buildStyle(s);
          showDetail();
        });

        await viewer.zoomTo(tileset, new Cesium.HeadingPitchRange(0, -0.5, 6000));

        // 측정 경로 지점은 이 화면(OSM 켜짐)에서 보고 고름
        const { getCesiumCamera } = await import("../bench/adapters/cesium.js");
        const { mountCopyButton } = await import("../bench/panel.js");
        mountCopyButton(() => getCesiumCamera(viewer));
      }

      // 측정 화면: 클릭한 건물의 속성을 날것으로 표시(featureId → 속성표 연결 확인용, 0-9 그대로)
      if (BENCH) {
        const info = document.getElementById("info");
        viewer.screenSpaceEventHandler.setInputAction((e) => {
          const f = viewer.scene.pick(e.position);
          if (!(f instanceof Cesium.Cesium3DTileFeature)) {
            info.textContent = "건물이 아님";
            return;
          }
          const lines = f
            .getPropertyIds()
            .map((id) => `${id}: ${f.getProperty(id)}`);
          info.textContent = `featureId: ${f.featureId}\n` + lines.join("\n");
          console.log(
            Object.fromEntries(
              f.getPropertyIds().map((id) => [id, f.getProperty(id)]),
            ),
          );
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
      }

      window.viewer = viewer;
      window.tileset = tileset; // 콘솔에서 확인용
    </script>
  </body>
</html>
